name: Release

# Builds the downloads for a tag and attaches them to a GitHub release: a portable archive for
# people who would rather not install anything, and an installer for people who would.
#
# It runs the test suite first: a tag that cannot pass its own gates should not become a
# download. The installer carries no updater and no sidecar; it installs the application and
# fetches the WebView2 runtime only if the machine does not already have it.
#
# The notes are the changelog for the tag, generated from its commits by git-cliff. What a
# person needs in order to use a download lives in the README instead of being restated on every
# release, where it would go out of date one release at a time.
#
# The binaries are not code-signed, so Windows SmartScreen warns on first run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Windows downloads
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The notes are generated from the history between this tag and the one before it, so
          # the whole history has to be here. A shallow fetch does not fail at this -- it
          # produces notes covering only the commits it happens to have, which look like a
          # complete changelog and are not. The step below refuses to publish from one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/gkrm-desktop/package-lock.json

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: The tag must match the version the workspace reports
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          for file in Cargo.toml apps/gkrm-desktop/package.json apps/gkrm-desktop/src-tauri/tauri.conf.json; do
            grep -q "\"\?version\"\? *[:=] *\"$version\"" "$file" || {
              echo "$file does not report $version; the tag and the product disagree"
              exit 1
            }
          done
          echo "version=$version" >> "$GITHUB_ENV"

      # Before the tests and the builds, so a template that cannot render costs a minute rather
      # than twenty, and so nothing is built for a release that could not describe itself.
      - name: The changelog for this tag
        run: |
          # Notes generated from part of the history read as though they were the whole
          # changelog, and nothing downstream can tell the difference, so this is checked before
          # anything is written rather than after: a tag can be moved and pushed again, a
          # published release cannot be unsaid.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "this clone is shallow, so the notes would cover only the commits it happens to"
            echo "have; the checkout needs fetch-depth: 0"
            exit 1
          fi

          cargo install git-cliff --locked --version 2.14.2
          mkdir -p dist
          notes="$(pwd)/dist/notes.md"
          git-cliff --latest --output "$notes"
          if [ ! -s "$notes" ]; then
            echo "git-cliff produced no notes for $GITHUB_REF_NAME; check cliff.toml"
            exit 1
          fi
          cat "$notes"
          echo "notes=$notes" >> "$GITHUB_ENV"

      - run: npm ci
        working-directory: apps/gkrm-desktop

      - name: Tests
        run: cargo test --workspace

      - name: Frontend tests
        run: npm run test:unit
        working-directory: apps/gkrm-desktop

      - name: Build the command line tool
        run: cargo build --release -p gkrm-cli

      - name: Build the application and its installer
        run: |
          rm -rf target/release/bundle
          npm --prefix apps/gkrm-desktop run tauri:build:installer

      - name: Assemble the downloads
        run: |
          name="fivem-resource-updater-${version}-windows-x64"
          mkdir -p "dist/$name"
          cp target/release/gkrm-desktop.exe "dist/$name/"
          cp target/release/gkrm.exe "dist/$name/"
          cp LICENSE "dist/$name/"
          cp README.md "dist/$name/"
          cp THIRD-PARTY-NOTICES.txt "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          # The bundler names the installer with spaces in it; a download link should not have
          # them, and the name should say what the archive beside it says.
          cp target/release/bundle/nsis/*-setup.exe "dist/$name-setup.exe"
          {
            echo "archive=dist/$name.zip"
            echo "installer=dist/$name-setup.exe"
          } >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            "$installer" "$archive" \
            --title "$tag" --notes-file "$notes" --verify-tag
