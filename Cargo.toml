[workspace]
members = [
    "crates/gkrm-core",
    "apps/gkrm-cli",
    "apps/gkrm-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5.23", features = ["derive"] }
full_moon = { version = "=2.2.0", default-features = false, features = ["lua54"] }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
gkrm-core = { path = "crates/gkrm-core" }
globset = "0.4.18"
libc = "0.2.169"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"
thiserror = "2.0.9"
tempfile = "3.14.0"
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"
uuid = { version = "1.24.0", features = ["v4"] }
winapi-util = "0.1.11"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
